<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>약품 위치 검색</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#17212b;margin:0;padding:24px}main{max-width:540px;margin:40px auto;background:white;border:1px solid #ddd;border-radius:18px;padding:24px}h1{font-size:26px}input{width:100%;padding:16px;font-size:22px;border:2px solid #aab5bf;border-radius:10px}#result{margin:20px 0;font-size:24px;font-weight:bold;color:#b91c1c;min-height:45px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{background:#edf0f3;padding:18px 4px;text-align:center;border-radius:8px;font-weight:bold}.active{background:#dc2626;color:white}small{color:#59636d}button{margin:12px 0;padding:8px;border:1px solid #ccc;background:white;border-radius:6px;cursor:pointer}
</style>
</head>
<body><main><h1>💊 약품 위치 검색</h1><p>약품 이름을 입력하세요.</p><input id="q" placeholder="예: 타이레놀" autocomplete="off" aria-label="약품 이름"><div id="result" aria-live="polite"></div><div id="grid" class="grid"></div><p><small>테스트용 가상 약장 및 약품 위치입니다.</small></p><div id="examples"></div></main>
<script>
const drugs=[['타이레놀','A2'],['아젤리아','C3'],['알마겔','B2'],['울트라셋','D1'],['니조랄','C2']];
const q=document.getElementById('q'), result=document.getElementById('result'),grid=document.getElementById('grid');
for(let n=1;n<=4;n++)for(const a of 'ABCD'){const cell=document.createElement('div');cell.className='cell';cell.textContent=a+n;grid.appendChild(cell)}
function search(){const s=q.value.trim();const matches=s?drugs.filter(d=>d[0].includes(s)):[];result.textContent=!s?'약품명을 입력하세요':matches.length?matches.map(d=>d[0]+' : '+d[1]).join(' / '):'검색 결과 없음';for(const cell of grid.children)cell.classList.toggle('active',matches.some(d=>d[1]===cell.textContent));}
q.addEventListener('input',search);for(const d of drugs){const b=document.createElement('button');b.textContent=d[0];b.onclick=()=>{q.value=d[0];search()};document.getElementById('examples').appendChild(b)}search();
</script></body></html>
