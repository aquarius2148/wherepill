<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WHEREPILL</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#162237;font:17px system-ui,sans-serif}main{max-width:1100px;margin:12px auto;padding:0 16px}header{margin-bottom:16px}header img{display:block;width:100%;height:auto;border-radius:12px} .panel{max-width:100%}h1{font-size:40px;letter-spacing:-2px;margin:0}header p{color:#65758b;margin:6px 0 28px}.panel{background:white;border:1px solid #dce3ec;border-radius:16px;padding:22px;margin-bottom:16px}button{border:0;border-radius:10px;background:#175cce;color:white;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #83aaff}input[type=search]{width:100%;padding:17px;font:inherit;font-size:24px;border:2px solid #a4b6ce;border-radius:12px}input:disabled{background:#eef1f5}small,#status,#count{color:#52627a;overflow-wrap:anywhere}#status{margin:12px 0 0}article{display:flex;align-items:center;justify-content:space-between;gap:15px;background:white;border:1px solid #dce3ec;border-radius:12px;padding:16px 20px;margin:9px 0}article strong{font-size:22px;overflow-wrap:anywhere}article b{font-size:36px;color:#126a40;white-space:nowrap}article small{display:block;margin-top:4px}footer{font-size:13px;color:#65758b;margin:26px 0} [hidden]{display:none!important}</style></head><body><main><header><img src="banner.png" alt="WHEREPILL ver 1.0 · 흐르는 식은땀을 닦아드리는 조제실의 드리클로!"></header><section class="panel"><button id="choose" type="button">📂 엑셀 파일 선택 / 갱신</button><input id="file" type="file" accept=".xlsx,.xlsm,.xls,.csv" hidden><p id="status" role="status">바탕화면에 저장된 약품 목록을 선택하세요.</p><small>원본 파일은 수정하지 않습니다.</small></section><section class="panel"><label for="search">약품명 검색</label><p style="margin:10px 0 0"><input id="search" type="search" placeholder="예: 타이레놀" autocomplete="off" disabled></p></section><p id="count" role="status"></p><div id="results"></div><button id="more" hidden>더 보기</button><footer>WHEREPILL · ver 1.0 · 선택한 파일은 브라우저 안에서만 처리합니다.</footer></main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let rows=[],matches=[],shown=0,loadId=0;const clean=s=>String(s??'').trim();const norm=s=>clean(s).normalize('NFKC').toLowerCase().replace(/\s+/g,'');const code=/^[a-z]+\s*\d+$/i;
$('choose').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;const id=++loadId;$('file').value='';$('choose').disabled=true;$('search').disabled=true;$('search').value='';render();$('status').textContent='읽는 중: '+f.name;try{if(!window.XLSX)throw Error('엑셀 읽기 모듈을 불러오지 못했습니다. 인터넷 연결 후 새로고침하세요.');const buf=await f.arrayBuffer();if(id!==loadId)return;const book=XLSX.read(buf,{type:'array'});const data=[];for(const name of book.SheetNames){const sheet=book.Sheets[name];for(const [addr,cell] of Object.entries(sheet)){if(addr.startsWith('!')||!cell||cell.t==='e')continue;const drug=clean(XLSX.utils.format_cell(cell));if(!drug||code.test(drug))continue;const pos=XLSX.utils.decode_cell(addr);const right=sheet[XLSX.utils.encode_cell({r:pos.r,c:pos.c+1})];const loc=right?clean(XLSX.utils.format_cell(right)):'';if(!code.test(loc))continue;data.push({drug,loc:loc.replace(/\s+/g,'').toUpperCase(),sheet:name,addr,key:norm(drug)});}}if(!data.length)throw Error('유효한 약품 위치가 없습니다. 기존 데이터는 유지됩니다.');rows=data;let saved=true;try{await cachePut({rows:data,name:f.name,date:new Date().toISOString()});}catch(e){saved=false;}if(id!==loadId)return;$('status').textContent=f.name+' · '+rows.length.toLocaleString()+'개 위치 등록 · '+(saved?'브라우저 저장 완료':'브라우저 저장 실패 (이번 실행만 사용)');if(!rows.length){$('status').textContent+=' (약품명 오른쪽에 M1, L3 등의 코드가 있는지 확인하세요.)';return;}$('search').disabled=false;$('search').focus();render();}catch(e){if(id===loadId){$('status').textContent='파일 읽기 실패: '+e.message;$('search').disabled=!rows.length;render();}}finally{$('choose').disabled=false;}};
function render(){const q=norm($('search').value);matches=q?rows.filter(r=>r.key.includes(q)):[];if(q)matches.sort((a,b)=>Number(b.key===q)-Number(a.key===q)||Number(b.key.startsWith(q))-Number(a.key.startsWith(q)));$('results').replaceChildren();shown=0;$('count').textContent=q?`검색 결과 ${matches.length.toLocaleString()}개`:rows.length?'약품명을 입력하세요.':'';append();}function append(){const end=Math.min(shown+100,matches.length);const frag=document.createDocumentFragment();for(;shown<end;shown++){const r=matches[shown],a=document.createElement('article'),left=document.createElement('div'),n=document.createElement('strong'),s=document.createElement('small'),b=document.createElement('b');n.textContent=r.drug;s.textContent=r.sheet+' · '+r.addr;b.textContent=r.loc;left.append(n,s);a.append(left,b);frag.append(a);}$('results').append(frag);$('more').hidden=shown>=matches.length;}$('search').addEventListener('input',render);$('more').onclick=append;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('wherepill-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function cachePut(value){const db=await openDB();try{await new Promise((resolve,reject)=>{const t=db.transaction('data','readwrite');t.objectStore('data').put(value,'current');t.oncomplete=resolve;t.onabort=t.onerror=()=>reject(t.error);});}finally{db.close();}}
async function restore(){try{const db=await openDB();let v;try{v=await new Promise((resolve,reject)=>{const r=db.transaction('data').objectStore('data').get('current');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}finally{db.close();}if(loadId||!v||!Array.isArray(v.rows)||!v.rows.length)return;rows=v.rows;$('status').textContent=v.name+' · '+rows.length.toLocaleString()+'개 · 저장 데이터 · '+new Date(v.date).toLocaleString('ko-KR');$('search').disabled=false;$('search').focus();render();}catch(e){if(!loadId)$('status').textContent='저장 데이터를 불러올 수 없습니다. 엑셀을 선택하세요.';}}restore();

</script></body></html>
